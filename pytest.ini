[pytest]
testpaths = tests

# Put the repository root on sys.path so `import backend` resolves regardless
# of how pytest is invoked. `python -m pytest` adds the working directory
# implicitly, but a bare `pytest` does not -- which passed locally and failed
# in CI.
pythonpath = .

addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:starlette.*
